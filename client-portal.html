<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globatong — Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   GLOBATONG CLIENT PORTAL — lightweight, standalone from index.html
   ============================================================ */
*{ margin:0; padding:0; box-sizing:border-box; }
body{
    font-family:'Inter', system-ui, -apple-system, sans-serif; background:#f5f6fa; color:#111827; line-height:1.5;
    min-height:100vh;
}
:root{
    --navy:#0B1B33; --brand:#0E6E62; --brand-dark:#094f46; --paper:#f5f6fa; --line:#e2e6ed;
    --ink:#111827; --steel:#4A5C72; --red:#c0392b; --amber:#b8862b;
}
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
input, select, textarea{ font-family:inherit; }
h1,h2,h3{ font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--navy); }
.hidden{ display:none !important; }

/* ---------- Auth screen ---------- */
#authScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:
        radial-gradient(circle at 20% 20%, rgba(14,110,98,0.12), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(11,27,51,0.08), transparent 50%),
        var(--paper);
}
.auth-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:2.2rem; width:100%; max-width:400px; box-shadow:0 20px 50px rgba(11,27,51,0.08); }
.auth-brand{ text-align:center; margin-bottom:1.6rem; }
.auth-brand .tag{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.3rem; color:var(--navy); letter-spacing:0.04em; }
.auth-brand .sub{ font-size:0.78rem; color:var(--steel); margin-top:0.2rem; }
.auth-tabs{ display:flex; border-bottom:1px solid var(--line); margin-bottom:1.4rem; }
.auth-tab{ flex:1; text-align:center; padding:0.7rem 0; font-weight:700; font-size:0.9rem; color:var(--steel); border-bottom:2px solid transparent; }
.auth-tab.active{ color:var(--brand); border-color:var(--brand); }
.field{ margin-bottom:0.9rem; }
.field label{ display:block; font-size:0.78rem; font-weight:600; color:var(--steel); margin-bottom:0.3rem; }
.field input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:0.65rem 0.8rem; font-size:0.92rem; }
.field input:focus{ outline:none; border-color:var(--brand); }
.auth-submit{ width:100%; background:var(--brand); color:#fff; padding:0.8rem; border-radius:8px; font-weight:700; margin-top:0.4rem; }
.auth-submit:hover{ background:var(--brand-dark); }
.auth-submit:disabled{ opacity:0.6; cursor:default; }
.auth-msg{ margin-top:0.9rem; padding:0.65rem 0.8rem; border-radius:8px; font-size:0.83rem; display:none; }
.auth-msg.show{ display:block; }
.auth-msg.error{ background:#fdeceb; color:#a4271f; }
.auth-msg.success{ background:#e7f7ee; color:#146c3d; }

/* ---------- Portal shell ---------- */
#portalScreen{ max-width:960px; margin:0 auto; padding:0 1.2rem 4rem; }
.portal-header{
    display:flex; align-items:center; justify-content:space-between; padding:1.2rem 0; border-bottom:1px solid var(--line);
    margin-bottom:1.8rem; flex-wrap:wrap; gap:0.6rem;
}
.portal-header .brand{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.25rem; color:var(--navy); }
.portal-header .brand span{ color:var(--brand); }
.portal-user{ display:flex; align-items:center; gap:0.8rem; font-size:0.85rem; color:var(--steel); }
.signout-btn{ border:1px solid var(--line); border-radius:8px; padding:0.45rem 0.8rem; font-weight:700; font-size:0.82rem; color:var(--navy); }
.signout-btn:hover{ border-color:var(--red); color:var(--red); }

section.portal-section{ margin-bottom:2.6rem; }
.section-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
.section-title h2{ font-size:1.35rem; }
.section-title p{ font-size:0.82rem; color:var(--steel); margin-top:0.1rem; }

.btn-primary{ background:var(--brand); color:#fff; padding:0.6rem 1.1rem; border-radius:8px; font-weight:700; font-size:0.85rem; }
.btn-primary:hover{ background:var(--brand-dark); }
.btn-ghost{ border:1px solid var(--line); color:var(--navy); padding:0.6rem 1.1rem; border-radius:8px; font-weight:700; font-size:0.85rem; }
.btn-ghost:hover{ border-color:var(--brand); color:var(--brand); }

/* new request form */
.new-request-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.4rem; margin-bottom:1.2rem; display:none; }
.new-request-card.show{ display:block; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
.form-grid .full{ grid-column:1/-1; }
@media (max-width:560px){ .form-grid{ grid-template-columns:1fr; } }
.form-grid label{ display:block; font-size:0.78rem; font-weight:600; color:var(--steel); margin-bottom:0.3rem; }
.form-grid input, .form-grid textarea{ width:100%; border:1px solid var(--line); border-radius:8px; padding:0.6rem 0.75rem; font-size:0.88rem; }
.form-grid textarea{ min-height:80px; resize:vertical; }
.form-actions{ display:flex; gap:0.6rem; margin-top:1rem; justify-content:flex-end; }

/* request cards */
.item-card{ background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:0.8rem; overflow:hidden; }
.item-head{ display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem; cursor:pointer; gap:0.8rem; flex-wrap:wrap; }
.item-head .title{ font-weight:700; color:var(--navy); font-size:0.95rem; }
.item-head .meta{ font-size:0.78rem; color:var(--steel); margin-top:0.15rem; }
.badge{ font-size:0.72rem; font-weight:700; padding:0.3rem 0.65rem; border-radius:999px; white-space:nowrap; }
.badge.pending{ background:#fdf3e3; color:var(--amber); }
.badge.active, .badge.in_progress{ background:#e3f2ff; color:#1c5fa8; }
.badge.done, .badge.completed{ background:#e7f7ee; color:#146c3d; }
.badge.default{ background:var(--paper); color:var(--steel); }
.item-body{ display:none; padding:0 1.2rem 1.2rem; border-top:1px solid var(--line); }
.item-body.show{ display:block; padding-top:1rem; }

/* progress bar */
.progress-track{ background:var(--paper); border-radius:999px; height:8px; overflow:hidden; margin-top:0.5rem; }
.progress-fill{ background:var(--brand); height:100%; border-radius:999px; }

/* thread / timeline */
.thread{ display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.9rem; }
.thread-msg{ background:var(--paper); border-radius:10px; padding:0.7rem 0.9rem; font-size:0.86rem; }
.thread-msg .who{ font-size:0.72rem; font-weight:700; color:var(--brand); margin-bottom:0.2rem; }
.thread-msg a.attachment{ display:inline-block; margin-top:0.4rem; font-size:0.78rem; font-weight:700; color:var(--brand); text-decoration:underline; }
.reply-row{ display:flex; gap:0.5rem; align-items:flex-start; flex-wrap:wrap; }
.reply-row textarea{ flex:1; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:0.55rem 0.7rem; font-size:0.85rem; min-height:44px; resize:vertical; }
.reply-row input[type=file]{ font-size:0.76rem; max-width:140px; }

.timeline{ display:flex; flex-direction:column; gap:0; margin-top:0.4rem; }
.tl-item{ display:flex; gap:0.7rem; padding-bottom:1rem; position:relative; }
.tl-item:not(:last-child)::before{ content:''; position:absolute; left:5px; top:14px; bottom:0; width:2px; background:var(--line); }
.tl-dot{ width:12px; height:12px; border-radius:50%; background:var(--brand); margin-top:4px; flex-shrink:0; z-index:1; }
.tl-content .tl-title{ font-weight:700; font-size:0.86rem; color:var(--navy); }
.tl-content .tl-desc{ font-size:0.8rem; color:var(--steel); margin-top:0.1rem; }
.tl-content .tl-time{ font-size:0.72rem; color:var(--steel); margin-top:0.2rem; }

.shipment-box{ background:var(--paper); border-radius:10px; padding:0.9rem 1rem; margin-bottom:0.9rem; font-size:0.85rem; }
.shipment-box .route{ font-weight:700; color:var(--navy); margin-bottom:0.3rem; }
.shipment-box .row{ display:flex; justify-content:space-between; color:var(--steel); font-size:0.8rem; padding:0.15rem 0; }

.empty-note{ text-align:center; color:var(--steel); font-size:0.86rem; padding:1.6rem; background:#fff; border:1px dashed var(--line); border-radius:12px; }
.loading-note{ text-align:center; color:var(--steel); font-size:0.86rem; padding:1rem; }
</style>
</head>
<body>

<!-- ============================================================
     AUTH SCREEN
     ============================================================ -->
<div id="authScreen">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="tag">GLOBATONG</div>
            <div class="sub">Client Portal</div>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabSignIn">Log In</button>
            <button class="auth-tab" id="tabSignUp">Sign Up</button>
        </div>

        <!-- Log In -->
        <form id="signInForm">
            <div class="field"><label for="si-email">Email</label><input type="email" id="si-email" required autocomplete="email"></div>
            <div class="field"><label for="si-password">Password</label><input type="password" id="si-password" required autocomplete="current-password"></div>
            <button type="submit" class="auth-submit" id="signInBtn">Log In</button>
        </form>

        <!-- Sign Up -->
        <form id="signUpForm" class="hidden">
            <div class="field"><label for="su-company">Company Name</label><input type="text" id="su-company" required></div>
            <div class="field"><label for="su-contact">Contact Name</label><input type="text" id="su-contact" required></div>
            <div class="field"><label for="su-country">Country</label><input type="text" id="su-country"></div>
            <div class="field"><label for="su-email">Email</label><input type="email" id="su-email" required autocomplete="email"></div>
            <div class="field"><label for="su-password">Password</label><input type="password" id="su-password" required minlength="6" autocomplete="new-password"></div>
            <button type="submit" class="auth-submit" id="signUpBtn">Create Account</button>
        </form>

        <div class="auth-msg" id="authMsg"></div>
    </div>
</div>

<!-- ============================================================
     PORTAL SCREEN
     ============================================================ -->
<div id="portalScreen" class="hidden">

    <div class="portal-header">
        <div class="brand">GLOBATONG <span>Client Portal</span></div>
        <div class="portal-user">
            <span id="userEmailLabel"></span>
            <button class="signout-btn" id="signOutBtn">Sign Out</button>
        </div>
    </div>

    <!-- ---------- Communication Center ---------- -->
    <section class="portal-section">
        <div class="section-title">
            <div>
                <h2>Communication Center</h2>
                <p>Submit a new request, attach files, and message your specialist.</p>
            </div>
            <button class="btn-primary" id="newRequestToggle">+ New Request</button>
        </div>

        <div class="new-request-card" id="newRequestCard">
            <div class="form-grid">
                <div><label for="nr-product">Product</label><input type="text" id="nr-product" placeholder="e.g. LiFePO4 battery pack"></div>
                <div><label for="nr-quantity">Quantity</label><input type="number" id="nr-quantity" min="1" placeholder="e.g. 500"></div>
                <div><label for="nr-destination">Destination</label><input type="text" id="nr-destination" placeholder="e.g. Los Angeles, USA"></div>
                <div><label for="nr-expected">Expected Time</label><input type="date" id="nr-expected"></div>
                <div class="full"><label for="nr-message">Message</label><textarea id="nr-message" placeholder="Describe what you need, specs, timeline, or any questions…"></textarea></div>
                <div class="full"><label for="nr-file">Attach a photo or document (optional)</label><input type="file" id="nr-file" accept="image/*,.pdf,.doc,.docx,.xlsx"></div>
            </div>
            <div class="form-actions">
                <button class="btn-ghost" id="cancelNewRequest">Cancel</button>
                <button class="btn-primary" id="submitNewRequest">Submit Request</button>
            </div>
        </div>

        <div id="requestsList"><div class="loading-note">Loading your requests…</div></div>
    </section>

    <!-- ---------- Project Display & Track ---------- -->
    <section class="portal-section">
        <div class="section-title">
            <div>
                <h2>Projects &amp; Shipment Tracking</h2>
                <p>Live status once a request becomes an active project.</p>
            </div>
        </div>
        <div id="projectsList"><div class="loading-note">Loading your projects…</div></div>
    </section>

</div>

<script>
"use strict";

/* ============================================================
   SUPABASE CONFIG — fill in your project's anon/public key below.
   Find it at: Supabase Dashboard → Project Settings → API → Project API keys → anon public
   ============================================================ */
const SUPABASE_URL = 'https://hgopuzgaklphobqynkjy.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_PUBLIC_KEY'; // <-- paste your anon key here

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ATTACHMENT_BUCKET = 'request-attachments'; // <-- create this Storage bucket in Supabase (can be public)

let currentUser = null;
let currentCustomer = null;

/* ---------------- Auth screen wiring ---------------- */
const authScreen = document.getElementById('authScreen');
const portalScreen = document.getElementById('portalScreen');
const authMsg = document.getElementById('authMsg');
const tabSignIn = document.getElementById('tabSignIn');
const tabSignUp = document.getElementById('tabSignUp');
const signInForm = document.getElementById('signInForm');
const signUpForm = document.getElementById('signUpForm');

function showAuthMsg(text, type){
    authMsg.textContent = text;
    authMsg.className = 'auth-msg show ' + (type || '');
}
function clearAuthMsg(){ authMsg.className = 'auth-msg'; }

tabSignIn.addEventListener('click', function(){
    tabSignIn.classList.add('active'); tabSignUp.classList.remove('active');
    signInForm.classList.remove('hidden'); signUpForm.classList.add('hidden');
    clearAuthMsg();
});
tabSignUp.addEventListener('click', function(){
    tabSignUp.classList.add('active'); tabSignIn.classList.remove('active');
    signUpForm.classList.remove('hidden'); signInForm.classList.add('hidden');
    clearAuthMsg();
});

signInForm.addEventListener('submit', async function(e){
    e.preventDefault();
    clearAuthMsg();
    const email = document.getElementById('si-email').value.trim();
    const password = document.getElementById('si-password').value;
    const btn = document.getElementById('signInBtn');
    btn.disabled = true; btn.textContent = 'Logging in…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Log In';
    if(error){ showAuthMsg(error.message, 'error'); return; }
    // onAuthStateChange handles the rest
});

signUpForm.addEventListener('submit', async function(e){
    e.preventDefault();
    clearAuthMsg();
    const company_name = document.getElementById('su-company').value.trim();
    const contact_name = document.getElementById('su-contact').value.trim();
    const country = document.getElementById('su-country').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;
    const btn = document.getElementById('signUpBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { company_name, contact_name, country } }
    });

    btn.disabled = false; btn.textContent = 'Create Account';
    if(error){ showAuthMsg(error.message, 'error'); return; }

    if(data.session){
        // Email confirmation is off — we're logged in immediately.
        // onAuthStateChange will create the customer row.
    } else {
        showAuthMsg('Account created! Check your email to confirm, then log in.', 'success');
        tabSignIn.click();
    }
});

document.getElementById('signOutBtn').addEventListener('click', async function(){
    await sb.auth.signOut();
});

/* ---------------- Session / customer bootstrap ---------------- */
sb.auth.onAuthStateChange(async function(_event, session){
    if(session && session.user){
        currentUser = session.user;
        await ensureCustomerRecord();
        document.getElementById('userEmailLabel').textContent = currentUser.email;
        authScreen.classList.add('hidden');
        portalScreen.classList.remove('hidden');
        loadRequests();
        loadProjects();
    } else {
        currentUser = null;
        currentCustomer = null;
        portalScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
    }
});

async function ensureCustomerRecord(){
    const { data: existing, error: fetchErr } = await sb
        .from('customers').select('*').eq('user_id', currentUser.id).maybeSingle();

    if(fetchErr){ console.error('customer lookup failed', fetchErr); return; }

    if(existing){
        currentCustomer = existing;
        return;
    }

    // First login after signup — create the customer row from auth metadata.
    const meta = currentUser.user_metadata || {};
    const { data: created, error: insertErr } = await sb
        .from('customers')
        .insert({
            user_id: currentUser.id,
            company_name: meta.company_name || '',
            contact_name: meta.contact_name || '',
            country: meta.country || null,
            email: currentUser.email
        })
        .select().single();

    if(insertErr){ console.error('customer creation failed', insertErr); return; }
    currentCustomer = created;
}

/* ---------------- New Request form toggle ---------------- */
const newRequestCard = document.getElementById('newRequestCard');
document.getElementById('newRequestToggle').addEventListener('click', function(){
    newRequestCard.classList.toggle('show');
});
document.getElementById('cancelNewRequest').addEventListener('click', function(){
    newRequestCard.classList.remove('show');
});

/* ---------------- Storage helper ---------------- */
async function uploadAttachment(file){
    if(!file) return null;
    const path = currentUser.id + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const { error } = await sb.storage.from(ATTACHMENT_BUCKET).upload(path, file);
    if(error){ console.error('upload failed', error); return null; }
    const { data } = sb.storage.from(ATTACHMENT_BUCKET).getPublicUrl(path);
    return data.publicUrl;
}

/* ---------------- Submit new request ---------------- */
document.getElementById('submitNewRequest').addEventListener('click', async function(){
    if(!currentCustomer){ alert('Your account is still being set up — try again in a moment.'); return; }

    const product = document.getElementById('nr-product').value.trim();
    const quantity = document.getElementById('nr-quantity').value;
    const destination = document.getElementById('nr-destination').value.trim();
    const expected_time = document.getElementById('nr-expected').value || null;
    const message = document.getElementById('nr-message').value.trim();
    const file = document.getElementById('nr-file').files[0];

    if(!product || !destination){ alert('Please fill in at least product and destination.'); return; }

    const btn = this;
    btn.disabled = true; btn.textContent = 'Submitting…';

    const request_number = 'REQ-' + Date.now().toString().slice(-8);

    const { data: newRequest, error } = await sb.from('requests').insert({
        customer_id: currentCustomer.id,
        request_number,
        product,
        quantity: quantity ? Number(quantity) : null,
        destination,
        expected_time,
        status: 'pending'
    }).select().single();

    if(error){
        btn.disabled = false; btn.textContent = 'Submit Request';
        alert('Something went wrong submitting your request: ' + error.message);
        return;
    }

    if(message || file){
        const attachment_url = await uploadAttachment(file);
        const { error: eventErr } = await sb.from('request_events').insert({
            request_id: newRequest.id,
            user_id: currentUser.id,
            event_type: 'message',
            message: message || null,
            attachment_url
        });
        if(eventErr){
            console.error('initial message failed to save', eventErr);
            alert('Your request was created, but the message/attachment failed to save: ' + eventErr.message);
        }
    }

    btn.disabled = false; btn.textContent = 'Submit Request';
    document.getElementById('nr-product').value = '';
    document.getElementById('nr-quantity').value = '';
    document.getElementById('nr-destination').value = '';
    document.getElementById('nr-expected').value = '';
    document.getElementById('nr-message').value = '';
    document.getElementById('nr-file').value = '';
    newRequestCard.classList.remove('show');
    await loadRequests();

    // Auto-expand the request we just created so its first message/attachment is visible immediately.
    const newBody = document.getElementById('request-body-' + newRequest.id);
    if(newBody){
        newBody.classList.add('show');
        loadThread(newRequest.id);
    }
});

/* ---------------- Load & render requests ---------------- */
async function loadRequests(){
    const listEl = document.getElementById('requestsList');
    const { data: requests, error } = await sb
        .from('requests').select('*')
        .eq('customer_id', currentCustomer ? currentCustomer.id : -1)
        .order('created_at', { ascending: false });

    if(error){ listEl.innerHTML = '<div class="empty-note">Couldn\'t load requests: ' + error.message + '</div>'; return; }
    if(!requests || requests.length === 0){ listEl.innerHTML = '<div class="empty-note">No requests yet — submit your first one above.</div>'; return; }

    listEl.innerHTML = requests.map(function(r){
        let etaLine = '';
        if(r.estimated_completion_at){
            etaLine = '<div class="meta">Est. completion: ' + formatDate(r.estimated_completion_at) + '</div>';
        } else if(r.processing_started_at){
            etaLine = '<div class="meta">Processing started ' + formatDate(r.processing_started_at) + '</div>';
        }
        return '<div class="item-card" data-request-id="' + r.id + '">' +
            '<div class="item-head" data-toggle-request="' + r.id + '">' +
                '<div><div class="title">' + escapeHtml(r.request_number) + ' — ' + escapeHtml(r.product || '') + '</div>' +
                '<div class="meta">' + escapeHtml(r.destination || '') + ' · Qty ' + (r.quantity || '—') + ' · ' + formatDate(r.created_at) + '</div>' +
                etaLine + '</div>' +
                '<span class="badge ' + badgeClass(r.status) + '">' + escapeHtml(r.status || 'pending') + '</span>' +
            '</div>' +
            '<div class="item-body" id="request-body-' + r.id + '">' +
                '<div class="thread" id="thread-' + r.id + '"><div class="loading-note">Loading messages…</div></div>' +
                '<div class="reply-row">' +
                    '<textarea id="reply-msg-' + r.id + '" placeholder="Reply or add a note…"></textarea>' +
                    '<input type="file" id="reply-file-' + r.id + '" accept="image/*,.pdf,.doc,.docx,.xlsx">' +
                    '<button class="btn-primary" data-send-reply="' + r.id + '">Send</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }).join('');

    document.querySelectorAll('[data-toggle-request]').forEach(function(head){
        head.addEventListener('click', function(){
            const id = head.getAttribute('data-toggle-request');
            const body = document.getElementById('request-body-' + id);
            const wasOpen = body.classList.contains('show');
            body.classList.toggle('show');
            if(!wasOpen) loadThread(id);
        });
    });
    document.querySelectorAll('[data-send-reply]').forEach(function(btn){
        btn.addEventListener('click', function(){ sendReply(btn.getAttribute('data-send-reply')); });
    });
}

async function loadThread(requestId){
    const threadEl = document.getElementById('thread-' + requestId);
    const { data: events, error } = await sb
        .from('request_events').select('*')
        .eq('request_id', requestId)
        .order('created_at', { ascending: true });

    if(error){ threadEl.innerHTML = '<div class="empty-note">Couldn\'t load messages.</div>'; return; }
    if(!events || events.length === 0){ threadEl.innerHTML = '<div class="empty-note">No messages yet.</div>'; return; }

    threadEl.innerHTML = events.map(function(ev, idx){
        const who = ev.user_id === currentUser.id ? 'You' : 'Globatong Team';
        const label = (idx === 0 && ev.user_id === currentUser.id) ? 'Original Request' : who;
        let html = '<div class="thread-msg"><div class="who">' + label + ' · ' + formatDate(ev.created_at) + '</div>';
        if(ev.message) html += '<div>' + escapeHtml(ev.message) + '</div>';
        if(ev.attachment_url) html += '<a class="attachment" href="' + ev.attachment_url + '" target="_blank" rel="noopener">📎 View attachment</a>';
        html += '</div>';
        return html;
    }).join('');
}

async function sendReply(requestId){
    const msgEl = document.getElementById('reply-msg-' + requestId);
    const fileEl = document.getElementById('reply-file-' + requestId);
    const message = msgEl.value.trim();
    const file = fileEl.files[0];
    if(!message && !file) return;

    const attachment_url = await uploadAttachment(file);
    const { error } = await sb.from('request_events').insert({
        request_id: requestId,
        user_id: currentUser.id,
        event_type: 'message',
        message: message || null,
        attachment_url
    });
    if(error){ alert('Message failed to send: ' + error.message); return; }

    msgEl.value = ''; fileEl.value = '';
    loadThread(requestId);
}

/* ---------------- Load & render projects (read-only) ---------------- */
async function loadProjects(){
    const listEl = document.getElementById('projectsList');
    const { data: projects, error } = await sb
        .from('projects').select('*')
        .eq('customer_id', currentCustomer ? currentCustomer.id : -1)
        .order('created_at', { ascending: false });

    if(error){ listEl.innerHTML = '<div class="empty-note">Couldn\'t load projects: ' + error.message + '</div>'; return; }
    if(!projects || projects.length === 0){ listEl.innerHTML = '<div class="empty-note">No active projects yet. Once a request is confirmed, it will appear here with live tracking.</div>'; return; }

    listEl.innerHTML = projects.map(function(p){
        const progress = Math.max(0, Math.min(100, p.progress || 0));
        return '<div class="item-card">' +
            '<div class="item-head" data-toggle-project="' + p.id + '">' +
                '<div><div class="title">' + escapeHtml(p.project_name || 'Project') + '</div>' +
                '<div class="meta">Started ' + formatDate(p.created_at) + '</div>' +
                '<div class="progress-track"><div class="progress-fill" style="width:' + progress + '%"></div></div></div>' +
                '<span class="badge ' + badgeClass(p.status) + '">' + escapeHtml(p.status || 'active') + '</span>' +
            '</div>' +
            '<div class="item-body" id="project-body-' + p.id + '">' +
                '<div id="project-detail-' + p.id + '"><div class="loading-note">Loading shipment &amp; timeline…</div></div>' +
            '</div>' +
        '</div>';
    }).join('');

    document.querySelectorAll('[data-toggle-project]').forEach(function(head){
        head.addEventListener('click', function(){
            const id = head.getAttribute('data-toggle-project');
            const body = document.getElementById('project-body-' + id);
            const wasOpen = body.classList.contains('show');
            body.classList.toggle('show');
            if(!wasOpen) loadProjectDetail(id);
        });
    });
}

async function loadProjectDetail(projectId){
    const detailEl = document.getElementById('project-detail-' + projectId);

    const [shipmentsRes, projectEventsRes, timelineRes] = await Promise.all([
        sb.from('shipments').select('*').eq('project_id', projectId).order('created_at', { ascending: false }),
        sb.from('project_events').select('*').eq('project_id', projectId),
        sb.from('timeline').select('*').eq('project_id', projectId)
    ]);

    const shipments = shipmentsRes.data || [];
    const shipmentIds = shipments.map(function(s){ return s.id; });

    let shipmentEvents = [];
    if(shipmentIds.length){
        const { data } = await sb.from('shipment_events').select('*').in('shipment_id', shipmentIds);
        shipmentEvents = data || [];
    }

    // merge all trackable events into one timeline, sorted chronologically
    const merged = []
        .concat((projectEventsRes.data || []).map(function(e){ return { time: e.event_time || e.created_at, title: e.title, desc: e.description, key: 'pe' + e.id }; }))
        .concat(shipmentEvents.map(function(e){ return { time: e.event_time || e.created_at, title: e.title, desc: (e.location ? e.location + ' — ' : '') + (e.description || ''), key: 'se' + e.id }; }))
        .concat((timelineRes.data || []).map(function(e){ return { time: e.created_at, title: e.status, desc: e.message, key: 'tl' + e.id }; }))
        .sort(function(a,b){ return new Date(a.time) - new Date(b.time); });

    let html = '';

    if(shipments.length){
        html += shipments.map(function(s){
            return '<div class="shipment-box">' +
                '<div class="route">' + escapeHtml(s.origin_port || '?') + ' → ' + escapeHtml(s.destination_port || '?') + '</div>' +
                '<div class="row"><span>Carrier</span><span>' + escapeHtml(s.carrier || '—') + '</span></div>' +
                '<div class="row"><span>Method</span><span>' + escapeHtml(s.shipping_method || '—') + '</span></div>' +
                '<div class="row"><span>Departure</span><span>' + formatDate(s.departure_date) + '</span></div>' +
                '<div class="row"><span>Est. Arrival</span><span>' + formatDate(s.estimated_arrival) + '</span></div>' +
                (s.actual_arrival ? '<div class="row"><span>Actual Arrival</span><span>' + formatDate(s.actual_arrival) + '</span></div>' : '') +
                '<div class="row"><span>Status</span><span class="badge ' + badgeClass(s.status) + '">' + escapeHtml(s.status || '—') + '</span></div>' +
            '</div>';
        }).join('');
    }

    if(merged.length){
        html += '<div class="timeline">' + merged.map(function(m){
            return '<div class="tl-item"><div class="tl-dot"></div><div class="tl-content">' +
                '<div class="tl-title">' + escapeHtml(m.title || 'Update') + '</div>' +
                (m.desc ? '<div class="tl-desc">' + escapeHtml(m.desc) + '</div>' : '') +
                '<div class="tl-time">' + formatDate(m.time) + '</div>' +
            '</div></div>';
        }).join('') + '</div>';
    } else if(!shipments.length){
        html = '<div class="empty-note">No tracking updates yet.</div>';
    }

    detailEl.innerHTML = html;
}

/* ---------------- Small helpers ---------------- */
function badgeClass(status){
    if(!status) return 'default';
    const s = status.toLowerCase().replace(/\s+/g, '_');
    if(['pending','new','submitted'].includes(s)) return 'pending';
    if(['active','in_progress','processing','shipped','in_transit'].includes(s)) return 'active';
    if(['done','completed','delivered','closed'].includes(s)) return 'done';
    return 'default';
}
function formatDate(d){
    if(!d) return '—';
    const date = new Date(d);
    if(isNaN(date.getTime())) return '—';
    return date.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}
function escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
}
